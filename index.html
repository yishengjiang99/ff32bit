<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>FF32Bit Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    a {
      width: 100%;
    }
  </style>
</head>

<body>
  <div class="player">
    <a href="/file_example_WAV_10MG.wav">sample</a>
  </div>
  <script type="module">
    import { FF32Play } from "./src/ffplayer.ts";
    // App initialization when loaded directly in a browser
    if (typeof document !== "undefined") {
      document.addEventListener("DOMContentLoaded", () => {
        let fp;
        document.querySelectorAll("a").forEach((a) => {
          a.onclick = (e) => {
            e.preventDefault();
            fp = fp || new FF32Play();
            fp.queue(a.href);
          };
        });
      });
    }

  </script>
</body>

</html>
