<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>FF32Bit Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
      font: 16px/1.4 system-ui, sans-serif;
    }

    .player {
      width: min(100% - 2rem, 28rem);
      text-align: center;
    }

    button {
      width: 100%;
      font: inherit;
      padding: 0.9rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
    }

    #status {
      min-height: 1.4em;
      margin: 1rem 0 0;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="player">
    <button type="button" id="play" data-src="./file_example_WAV_10MG.wav">Play sample</button>
    <p id="status">Tap to play</p>
  </div>
  <script type="module">
    import { FF32Play } from "./src/ffplayer.ts";

    const status = document.querySelector("#status");
    const button = document.querySelector("#play");
    let player;
    let wired = false;

    function setStatus(text) {
      status.textContent = text;
    }

    button.addEventListener("click", () => {
      const url = new URL(button.dataset.src, location.href).href;
      player = player || new FF32Play();
      if (!wired) {
        wired = true;
        player.addEventListener("progress", (event) => {
          const detail = event.detail?.data ?? event.detail ?? {};
          if (detail.ready) setStatus("Playing");
          if (detail.stats) setStatus(`Playing · ${detail.stats.buffered}s buffered`);
          if (detail.error) setStatus(detail.error);
        });
        player.addEventListener("error", (event) => {
          setStatus(event.detail || "Playback failed");
        });
      }
      setStatus("Loading…");
      player.queue(url).catch((err) => setStatus(String(err)));
    });
  </script>
</body>

</html>
