<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>FF32Bit Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
      font: 16px/1.4 system-ui, sans-serif;
    }

    .player {
      width: min(100% - 2rem, 28rem);
      text-align: center;
    }

    button {
      width: 100%;
      font: inherit;
      padding: 0.9rem 1.2rem;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #111;
    }

    #status {
      min-height: 1.4em;
      margin: 1rem 0 0;
      color: #aaa;
    }
  </style>
  <script type="module" crossorigin src="./assets/index.js"></script>
  <link rel="modulepreload" crossorigin href="./ffplayer.js">
</head>

<body>
  <div class="player">
    <button type="button" id="play">Play sample</button>
    <p id="status">Tap to play</p>
  </div>
</body>

</html>
